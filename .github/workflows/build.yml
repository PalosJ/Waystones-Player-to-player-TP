name: NeoForge 1.21.x Build

on:
  push:
    branches:
      - neoforge/1.21.x
  pull_request:
    branches:
      - neoforge/1.21.x
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neoforge-1.21.x-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-parity:
    name: Canonical main parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify shared semantic parity
        run: ./scripts/verify-branch-parity.sh branch

      - name: Verify target matrix references
        run: python3 scripts/verify-target-matrix.py --branch neoforge/1.21.x

  build:
    name: ${{ matrix.target }} (${{ matrix.stack }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target:
          - neoforge-1.21.2-1.21.3
          - neoforge-1.21.4
          - neoforge-1.21.5
          - neoforge-1.21.6
          - neoforge-1.21.7
          - neoforge-1.21.8
          - neoforge-1.21.9
          - neoforge-1.21.10
          - neoforge-1.21.11
        stack:
          - minimum
          - current

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Verify canonical branch parity
        run: ./scripts/verify-branch-parity.sh branch

      - name: Test core and build target
        run: >-
          ./gradlew
          :core:test
          :targets:${{ matrix.target }}:clean
          :targets:${{ matrix.target }}:build
          -PdependencyStack=${{ matrix.stack }}
          --no-build-cache
          --no-daemon
          --console=plain
          --warning-mode=all

      - name: Upload minimum-built release artifact
        if: matrix.stack == 'minimum'
        uses: actions/upload-artifact@v7
        with:
          name: waystonesplayer-${{ matrix.target }}
          path: targets/${{ matrix.target }}/build/libs/waystonesplayer-${{ matrix.target }}-1.0.0.jar
          if-no-files-found: error
          retention-days: 14
