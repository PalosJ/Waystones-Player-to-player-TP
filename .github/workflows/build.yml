name: Build

on: [push, pull_request]

jobs:
  build:
    name: Waystones ${{ matrix.waystones-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        waystones-version:
          - 21.1.36+1.21.1
          - 21.1.40+1.21.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: >-
          ./gradlew clean test build
          -Pwaystones_version=${{ matrix.waystones-version }}
          --no-build-cache
          --no-daemon
          --console=plain
          --warning-mode=all
