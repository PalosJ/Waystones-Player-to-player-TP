name: Build

on:
  push:
    branches:
      - neoforge/26.x
  pull_request:
    branches:
      - neoforge/26.x
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neoforge-26.x-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-parity:
    name: Canonical main parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify shared semantic parity
        run: ./scripts/verify-branch-parity.sh branch-26

      - name: Verify target matrix references
        run: python3 scripts/verify-target-matrix.py --branch neoforge/26.x

      - name: Test unified adapter source contracts
        run: python3 -m unittest discover -s scripts/unified-tests -v

  build:
    name: ${{ matrix.target }} (${{ matrix.stack }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target:
          - neoforge-26.1
          - neoforge-26.1.1
          - neoforge-26.1.2
          - neoforge-26.2
        stack:
          - minimum
          - current

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Verify canonical branch parity
        run: ./scripts/verify-branch-parity.sh branch-26

      - name: Test release tooling
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Build fixed Waystones 26.1.1 dependency
        if: matrix.target == 'neoforge-26.1.1'
        run: python3 scripts/prepare-waystones-source.py --loader neoforge

      - name: Test core and build target
        run: >-
          ./gradlew
          :core:test
          :targets:${{ matrix.target }}:clean
          :targets:${{ matrix.target }}:build
          -PdependencyStack=${{ matrix.stack }}
          --no-build-cache
          --no-daemon
          --console=plain
          --warning-mode=all

      - name: Upload minimum-built release artifact
        if: matrix.stack == 'minimum'
        uses: actions/upload-artifact@v7
        with:
          name: waystonesplayer-${{ matrix.target }}
          path: targets/${{ matrix.target }}/build/libs/waystonesplayer-${{ matrix.target }}-1.0.1.jar
          if-no-files-found: error
          retention-days: 14

  provenance:
    name: Minimum artifact provenance
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download minimum-built artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: waystonesplayer-neoforge-*
          path: build/runtime-artifacts
          merge-multiple: true

      - name: Generate and verify release manifest
        run: >-
          python3 scripts/release-manifest.py
          --branch neoforge/26.x
          --artifact-root build/runtime-artifacts
          --output build/release-manifest.json

      - name: Upload release manifest
        uses: actions/upload-artifact@v7
        with:
          name: waystonesplayer-release-manifest-neoforge-26.x
          path: build/release-manifest.json
          if-no-files-found: error
          retention-days: 14
