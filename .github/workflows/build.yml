name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-parity:
    name: Unified branch parity
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch unified branches
        run: >-
          git fetch --no-tags origin
          refs/heads/neoforge/1.21.x:refs/remotes/origin/neoforge/1.21.x
          refs/heads/fabric/1.21.x:refs/remotes/origin/fabric/1.21.x

      - name: Verify shared semantic parity
        run: >-
          ./scripts/verify-branch-parity.sh main
          origin/neoforge/1.21.x
          origin/fabric/1.21.x

      - name: Verify target matrix references
        run: python3 scripts/verify-target-matrix.py --branch main

      - name: Verify unified adapter parity
        run: >-
          ./scripts/verify-branch-parity.sh adapters
          origin/neoforge/1.21.x
          origin/fabric/1.21.x

  build:
    name: NeoForge 1.21.1 (${{ matrix.stack }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: minimum
            neo-version: 21.1.229
            waystones-version: 21.1.36+1.21.1
            balm-version: 21.0.62+1.21.1
          - stack: current
            neo-version: 21.1.248
            waystones-version: 21.1.40+1.21.1
            balm-version: 21.0.64+1.21.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Test release tooling
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Build and test
        run: >-
          ./gradlew clean test build
          -Pneo_version=${{ matrix.neo-version }}
          -Pwaystones_version=${{ matrix.waystones-version }}
          -Pbalm_version=${{ matrix.balm-version }}
          -PdependencyStack=${{ matrix.stack }}
          --no-build-cache
          --no-daemon
          --console=plain
          --warning-mode=all

      - name: Upload minimum-built release artifact
        if: matrix.stack == 'minimum'
        uses: actions/upload-artifact@v7
        with:
          name: waystonesplayer-neoforge-1.21.1
          path: neoforge/build/libs/waystonesplayer-neoforge-1.21.1-1.0.0.jar
          if-no-files-found: error
          retention-days: 14
