name: Full 1.21.x Runtime Smoke

on:
  workflow_run:
    workflows: [Build]
    branches:
      - main
      - neoforge/1.21.x
      - fabric/1.21.x
    types: [completed]
  workflow_dispatch:
    inputs:
      main_build_run_id:
        description: Successful main Build run ID for the exact current main commit
        required: true
        type: string
      neoforge_build_run_id:
        description: Successful NeoForge Build run ID for the exact unified branch commit
        required: true
        type: string
      fabric_build_run_id:
        description: Successful Fabric Build run ID for the exact unified branch commit
        required: true
        type: string
  schedule:
    - cron: '23 18 * * 6'

permissions:
  actions: read
  contents: read

concurrency:
  group: full-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  canonical-main:
    name: NeoForge 1.21.1 binary runtime
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Download exact main Build artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.main_build_run_id }}
        run: >-
          ./scripts/fetch-build-artifact.sh
          main
          "$REQUESTED_RUN_ID"
          waystonesplayer-neoforge-1.21.1
          waystonesplayer-neoforge-1.21.1-1.0.0.jar
          build/runtime-artifacts/neoforge-1.21.1

      - name: Verify Xvfb
        run: |
          command -v xvfb-run
          python3 scripts/verify-target-matrix.py --branch main

      - name: Run unchanged minimum JAR in minimum and current stacks
        run: >-
          python3 scripts/runtime-matrix.py
          --target neoforge-1.21.1
          --skip-build
          --binary "${{ steps.artifact.outputs.binary }}"
          --expected-sha256 "${{ steps.artifact.outputs.sha256 }}"
          --expected-commit "${{ steps.artifact.outputs.commit }}"
          --profiles minimum current
          --sides server client
          --xvfb
          --fail-fast
          --timeout 420

      - name: Upload canonical runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-neoforge-1.21.1
          path: |
            build/runtime-smoke-results/neoforge-1.21.1/
            runtime/neoforge-smoke/build/runs/neoforge-1.21.1/**/logs/
            runtime/neoforge-smoke/build/runs/neoforge-1.21.1/**/crash-reports/
          if-no-files-found: warn
          retention-days: 14

  neoforge-unified:
    name: ${{ matrix.target }} binary runtime
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'neoforge/1.21.x')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target:
          - neoforge-1.21.2-1.21.3
          - neoforge-1.21.4
          - neoforge-1.21.5
          - neoforge-1.21.6
          - neoforge-1.21.7
          - neoforge-1.21.8
          - neoforge-1.21.9
          - neoforge-1.21.10
          - neoforge-1.21.11

    steps:
      - name: Checkout NeoForge unified branch
        uses: actions/checkout@v7
        with:
          ref: neoforge/1.21.x
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Download exact NeoForge Build artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.neoforge_build_run_id }}
        run: >-
          ./scripts/fetch-build-artifact.sh
          neoforge/1.21.x
          "$REQUESTED_RUN_ID"
          waystonesplayer-${{ matrix.target }}
          waystonesplayer-${{ matrix.target }}-1.0.0.jar
          build/runtime-artifacts/${{ matrix.target }}

      - name: Verify Xvfb and canonical parity
        run: |
          command -v xvfb-run
          ./scripts/verify-branch-parity.sh branch
          python3 scripts/verify-target-matrix.py --branch neoforge/1.21.x

      - name: Run unchanged minimum JAR in every audited stack
        run: >-
          python3 scripts/runtime-matrix.py
          --target ${{ matrix.target }}
          --skip-build
          --binary "${{ steps.artifact.outputs.binary }}"
          --expected-sha256 "${{ steps.artifact.outputs.sha256 }}"
          --expected-commit "${{ steps.artifact.outputs.commit }}"
          --profiles minimum key current
          --sides server client
          --xvfb
          --fail-fast
          --timeout 420

      - name: Upload NeoForge runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-${{ matrix.target }}
          path: |
            build/runtime-smoke-results/${{ matrix.target }}/
            runtime/neoforge-smoke/build/runs/${{ matrix.target }}/**/logs/
            runtime/neoforge-smoke/build/runs/${{ matrix.target }}/**/crash-reports/
          if-no-files-found: warn
          retention-days: 14

  fabric-unified:
    name: ${{ matrix.target }} binary runtime
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'fabric/1.21.x')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target:
          - fabric-1.21.1
          - fabric-1.21.2-1.21.3
          - fabric-1.21.4
          - fabric-1.21.5
          - fabric-1.21.6
          - fabric-1.21.7
          - fabric-1.21.8
          - fabric-1.21.9
          - fabric-1.21.10
          - fabric-1.21.11

    steps:
      - name: Checkout Fabric unified branch
        uses: actions/checkout@v7
        with:
          ref: fabric/1.21.x
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Download exact Fabric Build artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.fabric_build_run_id }}
        run: >-
          ./scripts/fetch-build-artifact.sh
          fabric/1.21.x
          "$REQUESTED_RUN_ID"
          waystonesplayer-${{ matrix.target }}
          waystonesplayer-${{ matrix.target }}-1.0.0.jar
          build/runtime-artifacts/${{ matrix.target }}

      - name: Verify Xvfb and canonical parity
        run: |
          command -v xvfb-run
          ./scripts/verify-branch-parity.sh branch
          python3 scripts/verify-target-matrix.py --branch fabric/1.21.x

      - name: Run unchanged minimum JAR in every audited stack
        run: >-
          python3 scripts/runtime-matrix.py
          --target ${{ matrix.target }}
          --skip-build
          --binary "${{ steps.artifact.outputs.binary }}"
          --expected-sha256 "${{ steps.artifact.outputs.sha256 }}"
          --expected-commit "${{ steps.artifact.outputs.commit }}"
          --profiles minimum key current
          --sides server client
          --xvfb
          --fail-fast
          --timeout 420

      - name: Upload Fabric runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-${{ matrix.target }}
          path: |
            build/runtime-smoke-results/${{ matrix.target }}/
            runtime/fabric-smoke/build/runs/${{ matrix.target }}/**/logs/
            runtime/fabric-smoke/build/runs/${{ matrix.target }}/**/crash-reports/
          if-no-files-found: warn
          retention-days: 14
