name: NeoForge 1.21.x Runtime Smoke

on:
  workflow_run:
    workflows: [Build]
    branches:
      - neoforge/1.21.x
    types: [completed]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful NeoForge Build run ID for the exact unified branch commit
        required: true
        type: string
  schedule:
    - cron: '23 18 * * 6'

permissions:
  actions: read
  contents: read

concurrency:
  group: neoforge-runtime-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  runtime-smoke:
    name: ${{ matrix.target }} binary runtime
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'neoforge/1.21.x')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target:
          - neoforge-1.21.2-1.21.3
          - neoforge-1.21.4
          - neoforge-1.21.5
          - neoforge-1.21.6
          - neoforge-1.21.7
          - neoforge-1.21.8
          - neoforge-1.21.9
          - neoforge-1.21.10
          - neoforge-1.21.11

    steps:
      - name: Checkout NeoForge unified branch
        uses: actions/checkout@v7
        with:
          ref: neoforge/1.21.x
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Download exact NeoForge Build artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.build_run_id }}
        run: >-
          ./scripts/fetch-build-artifact.sh
          neoforge/1.21.x
          "$REQUESTED_RUN_ID"
          waystonesplayer-${{ matrix.target }}
          waystonesplayer-${{ matrix.target }}-1.0.1.jar
          build/runtime-artifacts/${{ matrix.target }}

      - name: Verify Xvfb and canonical parity
        run: |
          command -v xvfb-run
          ./scripts/verify-branch-parity.sh branch
          python3 scripts/verify-target-matrix.py --branch neoforge/1.21.x

      - name: Run unchanged minimum JAR in every audited stack
        run: >-
          python3 scripts/runtime-matrix.py
          --target ${{ matrix.target }}
          --skip-build
          --binary "${{ steps.artifact.outputs.binary }}"
          --expected-sha256 "${{ steps.artifact.outputs.sha256 }}"
          --expected-commit "${{ steps.artifact.outputs.commit }}"
          --profiles minimum key current
          --sides server client
          --xvfb
          --fail-fast
          --timeout 420

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-${{ matrix.target }}
          path: |
            build/runtime-smoke-results/${{ matrix.target }}/
            runtime/neoforge-smoke/build/runs/${{ matrix.target }}/**/logs/
            runtime/neoforge-smoke/build/runs/${{ matrix.target }}/**/crash-reports/
          if-no-files-found: warn
          retention-days: 14
