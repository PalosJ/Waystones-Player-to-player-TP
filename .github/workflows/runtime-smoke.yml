name: NeoForge 1.21.x Runtime Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neoforge-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime-smoke:
    name: ${{ matrix.target }} binary runtime
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target:
          - neoforge-1.21.2-1.21.3
          - neoforge-1.21.4
          - neoforge-1.21.5
          - neoforge-1.21.6
          - neoforge-1.21.7
          - neoforge-1.21.8
          - neoforge-1.21.9
          - neoforge-1.21.10
          - neoforge-1.21.11

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Verify Xvfb and canonical parity
        run: |
          command -v xvfb-run
          ./scripts/verify-branch-parity.sh branch
          python3 scripts/verify-target-matrix.py

      - name: Run unchanged minimum JAR in every audited stack
        run: >-
          python3 scripts/runtime-matrix.py
          --target ${{ matrix.target }}
          --profiles minimum key current
          --sides server client
          --xvfb
          --fail-fast
          --timeout 420

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-${{ matrix.target }}
          path: |
            build/runtime-smoke-results/${{ matrix.target }}/
            runtime/neoforge-smoke/build/runs/${{ matrix.target }}/**/logs/
            runtime/neoforge-smoke/build/runs/${{ matrix.target }}/**/crash-reports/
          if-no-files-found: warn
          retention-days: 14
