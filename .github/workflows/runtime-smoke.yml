name: Fabric 26.x Runtime Smoke

on:
  workflow_run:
    workflows: [Build]
    branches:
      - fabric/26.x
    types: [completed]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Fabric 26.x Build run ID for the exact unified branch commit
        required: true
        type: string
  schedule:
    - cron: '23 18 * * 6'

permissions:
  actions: read
  contents: read

concurrency:
  group: fabric-runtime-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  runtime-smoke:
    name: ${{ matrix.target }} binary runtime
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'fabric/26.x')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target:
          - fabric-26.1
          - fabric-26.1.1
          - fabric-26.1.2
          - fabric-26.2

    steps:
      - name: Checkout Fabric unified branch
        uses: actions/checkout@v7
        with:
          ref: fabric/26.x
          fetch-depth: 0

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Download exact Fabric Build artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.build_run_id }}
        run: >-
          ./scripts/fetch-build-artifact.sh
          fabric/26.x
          "$REQUESTED_RUN_ID"
          waystonesplayer-${{ matrix.target }}
          waystonesplayer-${{ matrix.target }}-1.0.0.jar
          build/runtime-artifacts/${{ matrix.target }}

      - name: Verify Xvfb and canonical parity
        run: |
          command -v xvfb-run
          ./scripts/verify-branch-parity.sh branch-26
          python3 scripts/verify-target-matrix.py --branch fabric/26.x

      - name: Rebuild fixed Waystones 26.1.1 dependency
        if: matrix.target == 'fabric-26.1.1'
        run: >-
          python3 scripts/prepare-waystones-source.py
          --loader fabric
          --expected-sha256 "${{ steps.artifact.outputs.upstream_waystones_sha256 }}"

      - name: Run unchanged minimum JAR in every audited stack
        run: >-
          python3 scripts/runtime-matrix.py
          --target ${{ matrix.target }}
          --skip-build
          --binary "${{ steps.artifact.outputs.binary }}"
          --expected-sha256 "${{ steps.artifact.outputs.sha256 }}"
          --expected-commit "${{ steps.artifact.outputs.commit }}"
          --profiles minimum current
          --sides server client
          --xvfb
          --fail-fast
          --timeout 420

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-${{ matrix.target }}
          path: |
            build/runtime-smoke-results/${{ matrix.target }}/
            runtime/fabric-smoke/build/runs/${{ matrix.target }}/**/logs/
            runtime/fabric-smoke/build/runs/${{ matrix.target }}/**/crash-reports/
          if-no-files-found: warn
          retention-days: 14
