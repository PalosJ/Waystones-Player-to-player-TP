name: Full 1.21.x Runtime Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '23 18 * * 6'

permissions:
  contents: read

concurrency:
  group: full-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  canonical-main:
    name: NeoForge 1.21.1 binary runtime
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Verify Xvfb
        run: |
          command -v xvfb-run
          python3 scripts/verify-target-matrix.py --branch main

      - name: Run unchanged minimum JAR in minimum and current stacks
        run: >-
          python3 scripts/runtime-matrix.py
          --target neoforge-1.21.1
          --profiles minimum current
          --sides server client
          --xvfb
          --fail-fast
          --timeout 420

      - name: Upload canonical runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-neoforge-1.21.1
          path: |
            build/runtime-smoke-results/neoforge-1.21.1/
            runtime/neoforge-smoke/build/runs/neoforge-1.21.1/**/logs/
            runtime/neoforge-smoke/build/runs/neoforge-1.21.1/**/crash-reports/
          if-no-files-found: warn
          retention-days: 14

  neoforge-unified:
    name: ${{ matrix.target }} binary runtime
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target:
          - neoforge-1.21.2-1.21.3
          - neoforge-1.21.4
          - neoforge-1.21.5
          - neoforge-1.21.6
          - neoforge-1.21.7
          - neoforge-1.21.8
          - neoforge-1.21.9
          - neoforge-1.21.10
          - neoforge-1.21.11

    steps:
      - name: Checkout NeoForge unified branch
        uses: actions/checkout@v7
        with:
          ref: neoforge/1.21.x
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Verify Xvfb and canonical parity
        run: |
          command -v xvfb-run
          ./scripts/verify-branch-parity.sh branch
          python3 scripts/verify-target-matrix.py --branch neoforge/1.21.x

      - name: Run unchanged minimum JAR in every audited stack
        run: >-
          python3 scripts/runtime-matrix.py
          --target ${{ matrix.target }}
          --profiles minimum key current
          --sides server client
          --xvfb
          --fail-fast
          --timeout 420

      - name: Upload NeoForge runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-${{ matrix.target }}
          path: |
            build/runtime-smoke-results/${{ matrix.target }}/
            runtime/neoforge-smoke/build/runs/${{ matrix.target }}/**/logs/
            runtime/neoforge-smoke/build/runs/${{ matrix.target }}/**/crash-reports/
          if-no-files-found: warn
          retention-days: 14

  fabric-unified:
    name: ${{ matrix.target }} binary runtime
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target:
          - fabric-1.21.1
          - fabric-1.21.2-1.21.3
          - fabric-1.21.4
          - fabric-1.21.5
          - fabric-1.21.6
          - fabric-1.21.7
          - fabric-1.21.8
          - fabric-1.21.9
          - fabric-1.21.10
          - fabric-1.21.11

    steps:
      - name: Checkout Fabric unified branch
        uses: actions/checkout@v7
        with:
          ref: fabric/1.21.x
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Verify Xvfb and canonical parity
        run: |
          command -v xvfb-run
          ./scripts/verify-branch-parity.sh branch
          python3 scripts/verify-target-matrix.py --branch fabric/1.21.x

      - name: Run unchanged minimum JAR in every audited stack
        run: >-
          python3 scripts/runtime-matrix.py
          --target ${{ matrix.target }}
          --profiles minimum key current
          --sides server client
          --xvfb
          --fail-fast
          --timeout 420

      - name: Upload Fabric runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-${{ matrix.target }}
          path: |
            build/runtime-smoke-results/${{ matrix.target }}/
            runtime/fabric-smoke/build/runs/${{ matrix.target }}/**/logs/
            runtime/fabric-smoke/build/runs/${{ matrix.target }}/**/crash-reports/
          if-no-files-found: warn
          retention-days: 14
