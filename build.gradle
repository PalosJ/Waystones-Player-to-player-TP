plugins {
    id 'net.neoforged.moddev' version '2.0.143' apply false
}

version = mod_version
group = mod_group_id

def commonSources = fileTree('common/src') {
    include '**/*.java'
}
def coreSources = fileTree('core/src') {
    include '**/*.java'
}
def targetMatrixFile = file('gradle/targets.json')

def verifyCommonLoaderBoundary = tasks.register('verifyCommonLoaderBoundary') {
    group = 'verification'
    description = 'Rejects Fabric or NeoForge API imports from the shared common module.'
    inputs.files(commonSources)

    doLast {
        def forbiddenPrefixes = ['net.fabricmc.', 'net.neoforged.']
        def violations = []
        commonSources.files.sort().each { source ->
            source.eachLine('UTF-8') { line, lineNumber ->
                forbiddenPrefixes.each { prefix ->
                    if (line.contains(prefix)) {
                        violations << "${relativePath(source)}:${lineNumber}: ${prefix}"
                    }
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("Loader APIs found in common:\n${violations.join('\n')}")
        }
    }
}

def verifyCorePurity = tasks.register('verifyCorePurity') {
    group = 'verification'
    description = 'Rejects Minecraft, loader, Balm, Waystones, or Mixin APIs from the pure Java core.'
    inputs.files(coreSources)

    doLast {
        def forbiddenPrefixes = [
                'net.minecraft.',
                'net.fabricmc.',
                'net.neoforged.',
                'net.blay09.',
                'org.spongepowered.asm.mixin.',
        ]
        def violations = []
        coreSources.files.sort().each { source ->
            source.eachLine('UTF-8') { line, lineNumber ->
                forbiddenPrefixes.each { prefix ->
                    if (line.contains(prefix)) {
                        violations << "${relativePath(source)}:${lineNumber}: ${prefix}"
                    }
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("Platform APIs found in pure core:\n${violations.join('\n')}")
        }
    }
}

def verifyTargetMatrix = tasks.register('verifyTargetMatrix') {
    group = 'verification'
    description = 'Validates the canonical 1.21.x and 26.x release/dependency matrix.'
    inputs.file(targetMatrixFile)

    doLast {
        def matrix = new groovy.json.JsonSlurper().parse(targetMatrixFile)
        def require = { boolean condition, String message ->
            if (!condition) {
                throw new GradleException("Invalid target matrix: ${message}")
            }
        }

        require(matrix.schemaVersion == 1, 'schemaVersion must be 1.')
        require(matrix.modId == mod_id, "modId must match ${mod_id}.")
        require(matrix.modVersion == mod_version, "modVersion must remain ${mod_version}.")
        def tools121 = matrix.buildTools['1.21']
        def tools26 = matrix.buildTools['26']
        require(tools121.java == 21
                && tools121.neoforgeGradle == '9.2.1'
                && tools121.fabricGradle == '9.5.1'
                && tools121.modDevGradle == '2.0.143'
                && tools121.loom == '1.17.19'
                && tools26.java == 25
                && tools26.neoforgeGradle == '9.2.1'
                && tools26.fabricGradle == '9.5.1'
                && tools26.modDevGradle == '2.0.143'
                && tools26.loom == '1.17.19'
                && tools26.sourceGradle == '9.3.1'
                && tools26.sourceLoom == '1.14-20251223.202653-9'
                && tools26.sourceShogiApi == '26.1.0.1-20260324.181500-45',
                'build-tool versions must match the audited release toolchain.')
        def iconFile = file('common/src/main/resources/waystonesptpt.png')
        def iconSha256 = java.security.MessageDigest.getInstance('SHA-256')
                .digest(iconFile.bytes)
                .encodeHex()
                .toString()
        require(matrix.iconSha256 == iconSha256,
                'the existing project icon must remain byte-for-byte unchanged.')
        require(matrix.targets instanceof List && matrix.targets.size() == 28,
                'exactly 28 release artifacts are required.')

        def targets = matrix.targets
        require(targets*.id.toSet().size() == targets.size(), 'target IDs must be unique.')
        require(targets*.artifactFile.toSet().size() == targets.size(), 'artifact file names must be unique.')
        require(targets.count { it.branch == 'main' } == 1, 'main must contain exactly one target.')
        require(targets.count { it.branch == 'neoforge/1.21.x' } == 9,
                'neoforge/1.21.x must contain nine targets.')
        require(targets.count { it.branch == 'fabric/1.21.x' } == 10,
                'fabric/1.21.x must contain ten targets.')
        require(targets.count { it.branch == 'neoforge/26.x' } == 4,
                'neoforge/26.x must contain four targets.')
        require(targets.count { it.branch == 'fabric/26.x' } == 4,
                'fabric/26.x must contain four targets.')

        def expectedVersions = (1..11).collect { "1.21.${it}" } as Set
        ['neoforge', 'fabric'].each { loader ->
            def actualVersions = targets.findAll { it.loader == loader && it.branch.endsWith('/1.21.x') || (loader == 'neoforge' && it.branch == 'main') }
                    .collectMany { it.minecraft as List }
                    .toSet()
            require(actualVersions == expectedVersions,
                    "${loader} must cover every Minecraft release from 1.21.1 through 1.21.11 exactly once.")
        }
        def expected26Versions = ['26.1', '26.1.1', '26.1.2', '26.2'] as Set
        ['neoforge', 'fabric'].each { loader ->
            def actualVersions = targets.findAll { it.loader == loader && it.branch == "${loader}/26.x" }
                    .collectMany { it.minecraft as List }
                    .toSet()
            require(actualVersions == expected26Versions,
                    "${loader}/26.x must cover 26.1, 26.1.1, 26.1.2 and 26.2 exactly once.")
        }

        def sharedIds = ['neoforge-1.21.2-1.21.3', 'fabric-1.21.2-1.21.3'] as Set
        def expectedKeyStacks = [
                'neoforge-1.21.4' : [
                        neoforge: '21.4.121',
                        waystones: '21.4.5+1.21.4',
                        balm: '21.4.9+1.21.4',
                ],
                'neoforge-1.21.10': [
                        neoforge: '21.10.64',
                        waystones: '21.10.2+1.21.10',
                        balm: '21.10.5+1.21.10',
                ],
                'neoforge-1.21.11': [
                        neoforge: '21.11.42',
                        waystones: '21.11.4',
                        waystonesCapability: 'waystones-neoforge-1.21.11',
                        balm: '21.11.3',
                ],
                'fabric-1.21.4'   : [
                        fabricLoader: '0.16.10',
                        fabricApi: '0.110.5+1.21.4',
                        waystones: '21.4.5+1.21.4',
                        balm: '21.4.9+1.21.4',
                ],
                'fabric-1.21.10'  : [
                        fabricLoader: '0.17.2',
                        fabricApi: '0.134.1+1.21.10',
                        waystones: '21.10.2+1.21.10',
                        balm: '21.10.6+1.21.10',
                ],
                'fabric-1.21.11'  : [
                        fabricLoader: '0.18.1',
                        fabricApi: '0.141.6+1.21.11',
                        waystones: '21.11.4',
                        waystonesCapability: 'waystones-fabric-1.21.11',
                        balm: '21.11.3',
                ],
        ]
        targets.each { target ->
            require(target.releaseVersion == matrix.modVersion,
                    "${target.id} must use release version ${matrix.modVersion}.")
            require(target.artifactFile == "${matrix.modId}-${target.id}-${matrix.modVersion}.jar",
                    "${target.id} has a non-canonical artifact file name.")
            require(target.minecraft instanceof List && !target.minecraft.isEmpty(),
                    "${target.id} must declare supported Minecraft versions.")
            require(target.minecraft.size() == (sharedIds.contains(target.id) ? 2 : 1),
                    "${target.id} has an invalid shared-version boundary.")
            if (sharedIds.contains(target.id)) {
                require((target.minecraft as Set) == (['1.21.2', '1.21.3'] as Set),
                        "${target.id} may only share Minecraft 1.21.2 and 1.21.3.")
            }
            require(target.minecraft.contains(target.compile.minecraft),
                    "${target.id} compile Minecraft must be one of its supported versions.")
            require(target.minimum.waystones && target.minimum.balm
                    && target.current.waystones && target.current.balm,
                    "${target.id} must declare minimum and current Waystones/Balm versions.")
            def dependencyVersions = [
                    target.minimum.waystones,
                    target.minimum.balm,
                    target.current.waystones,
                    target.current.balm,
            ]
            if (target.key) {
                dependencyVersions.addAll([target.key.waystones, target.key.balm])
            }
            if (target.branch.endsWith('/26.x')) {
                require(target.minimum.shogi && target.current.shogi,
                        "${target.id} must declare minimum and current Shogi versions.")
                dependencyVersions.addAll([target.minimum.shogi, target.current.shogi])
            } else {
                require(!target.minimum.containsKey('shogi') && !target.current.containsKey('shogi'),
                        "${target.id} must not declare a 26.x-only Shogi stack.")
            }
            require(dependencyVersions.every { !it.contains('SNAPSHOT') },
                    "${target.id} runtime stacks must use immutable release dependencies.")
            require(target.families.balm && target.families.screen && target.families.teleport,
                    "${target.id} must name each source adapter family.")
            if (target.branch.endsWith('/26.x')) {
                require(target.families == [
                        balm: 'load-context-26',
                        screen: 'graphics-extractor-26',
                        teleport: 'shogi-26',
                ], "${target.id} must use the audited 26.x adapter families.")
                def sourceExpected = target.minecraft == ['26.1.1']
                require(sourceExpected == target.containsKey('waystonesSource'),
                        "${target.id} has an invalid fixed-source declaration.")
                if (sourceExpected) {
                    require(target.waystonesSource.repository == 'https://github.com/TwelveIterations/Waystones.git'
                            && target.waystonesSource.commit == '795bb9ac93e73a0df8e5678ba6746dfbf8b055a3'
                            && target.waystonesSource.version == '26.1.1.0'
                            && target.waystonesSource.patch == 'scripts/upstream/waystones-26.1.1.patch'
                            && target.waystonesSource.patchSha256 == '77707c33069f6f1def1b4262b6961b1851ab97915019138039f9c2ce587a42bd',
                            "${target.id} fixed Waystones source identity changed.")
                }
            } else {
                require(!target.containsKey('waystonesSource'),
                        "${target.id} must not declare a 26.1.1 source build.")
            }
            if (expectedKeyStacks.containsKey(target.id)) {
                require(target.key == expectedKeyStacks[target.id],
                        "${target.id} must keep its audited key runtime stack.")
                require(target.keyReason instanceof String && !target.keyReason.trim().isEmpty(),
                        "${target.id} must explain its key runtime boundary.")
            } else {
                require(!target.containsKey('key') && !target.containsKey('keyReason'),
                        "${target.id} must not declare a redundant key runtime stack.")
            }

            if (target.loader == 'neoforge') {
                require(target.minimum.neoforge && target.current.neoforge,
                        "${target.id} must declare minimum and current NeoForge versions.")
                require(!target.containsKey('balmModId'),
                        "${target.id} must not declare a Fabric Balm mod ID.")
                def expectedWaystonesCapability = target.id == 'neoforge-1.21.11'
                        ? 'waystones-neoforge-1.21.11'
                        : null
                require(target.minimum.waystonesCapability == expectedWaystonesCapability,
                        "${target.id} has an invalid minimum Waystones capability override.")
                require(!target.current.containsKey('waystonesCapability'),
                        "${target.id} current stack must resolve the default Waystones capability.")
            } else if (target.loader == 'fabric') {
                require(target.minimum.fabricLoader && target.minimum.fabricApi
                        && target.current.fabricLoader && target.current.fabricApi,
                        "${target.id} must declare minimum and current Fabric Loader/API versions.")
                def legacyBalmIds = ['fabric-1.21.2-1.21.3', 'fabric-1.21.4'] as Set
                def expectedBalmId = legacyBalmIds.contains(target.id) ? 'balm-fabric' : 'balm'
                require(target.balmModId == expectedBalmId,
                        "${target.id} must use Fabric dependency ID ${expectedBalmId}.")
                [target.minimum, target.key, target.current].findAll { it != null }.each { stack ->
                    if (stack.containsKey('balmRuntimeModId')) {
                        require(stack.balmRuntimeModId in ['balm', 'balm-fabric'],
                                "${target.id} has an invalid Balm runtime mod ID.")
                    }
                }
                def expectedWaystonesCapability = target.id == 'fabric-1.21.11'
                        ? 'waystones-fabric-1.21.11'
                        : null
                require(target.minimum.waystonesCapability == expectedWaystonesCapability,
                        "${target.id} has an invalid minimum Waystones capability override.")
                require(!target.current.containsKey('waystonesCapability'),
                        "${target.id} current stack must resolve the default Waystones capability.")
            } else {
                require(false, "${target.id} has unknown loader ${target.loader}.")
            }

            if (sharedIds.contains(target.id)) {
                require(target.runtimeStacks instanceof List && target.runtimeStacks.size() == 2,
                        "${target.id} must declare separate 1.21.2 and 1.21.3 runtime stacks.")
                require((target.runtimeStacks*.minecraft as Set) == (target.minecraft as Set),
                        "${target.id} runtime stacks must cover both shared Minecraft versions.")
            } else {
                require(!target.containsKey('runtimeStacks'),
                        "${target.id} must not declare redundant runtime stacks.")
            }
        }
    }
}

subprojects {
    apply plugin: 'java-library'

    version = rootProject.version
    group = rootProject.group

    repositories {
        maven {
            name = 'FixedUpstreamBuilds'
            url = rootProject.layout.buildDirectory.dir('upstream-maven')
            content {
                includeGroup 'net.blay09.mods'
            }
        }
        mavenCentral()
        maven {
            name = 'TwelveIterations'
            url = uri('https://maven.twelveiterations.com/repository/maven-public/')
            content {
                includeGroup 'net.blay09.mods'
            }
        }
        maven {
            name = 'ParchmentMC'
            url = uri('https://maven.parchmentmc.org/')
            content {
                includeGroup 'org.parchmentmc.data'
            }
        }
        maven {
            name = 'NeoForge'
            url = uri('https://maven.neoforged.net/releases')
        }
        maven {
            name = 'SpongePowered'
            url = uri('https://repo.spongepowered.org/repository/maven-public/')
            content {
                includeGroup 'org.spongepowered'
            }
        }
        maven {
            name = 'TencentCloudFallback'
            url = uri('https://mirrors.cloud.tencent.com/nexus/repository/maven-public/')
        }
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(java_version))
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(ProcessResources).configureEach {
        filteringCharset = 'UTF-8'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    tasks.named('check').configure {
        dependsOn verifyCommonLoaderBoundary
        dependsOn verifyCorePurity
        dependsOn verifyTargetMatrix
    }

    tasks.withType(Jar).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}
