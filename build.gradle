plugins {
    id 'net.neoforged.moddev' version '2.0.141' apply false
}

version = mod_version
group = mod_group_id

def commonSources = fileTree('common/src') {
    include '**/*.java'
}

def verifyCommonLoaderBoundary = tasks.register('verifyCommonLoaderBoundary') {
    group = 'verification'
    description = 'Rejects Fabric or NeoForge API imports from the shared common module.'
    inputs.files(commonSources)

    doLast {
        def forbiddenPrefixes = ['net.fabricmc.', 'net.neoforged.']
        def violations = []
        commonSources.files.sort().each { source ->
            source.eachLine('UTF-8') { line, lineNumber ->
                forbiddenPrefixes.each { prefix ->
                    if (line.contains(prefix)) {
                        violations << "${relativePath(source)}:${lineNumber}: ${prefix}"
                    }
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("Loader APIs found in common:\n${violations.join('\n')}")
        }
    }
}

subprojects {
    apply plugin: 'java-library'

    version = rootProject.version
    group = rootProject.group

    repositories {
        mavenCentral()
        maven {
            name = 'TwelveIterations'
            url = uri('https://maven.twelveiterations.com/repository/maven-public/')
            content {
                includeGroup 'net.blay09.mods'
            }
        }
        maven {
            name = 'ParchmentMC'
            url = uri('https://maven.parchmentmc.org/')
            content {
                includeGroup 'org.parchmentmc.data'
            }
        }
        maven {
            name = 'NeoForge'
            url = uri('https://maven.neoforged.net/releases')
        }
        maven {
            name = 'SpongePowered'
            url = uri('https://repo.spongepowered.org/repository/maven-public/')
            content {
                includeGroup 'org.spongepowered'
            }
        }
        maven {
            name = 'TencentCloudFallback'
            url = uri('https://mirrors.cloud.tencent.com/nexus/repository/maven-public/')
        }
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(21)
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(ProcessResources).configureEach {
        filteringCharset = 'UTF-8'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    tasks.named('check').configure {
        dependsOn verifyCommonLoaderBoundary
    }
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}
