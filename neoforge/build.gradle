plugins {
    id 'net.neoforged.moddev'
}

def targetMatrix = new groovy.json.JsonSlurper().parse(rootProject.file('gradle/targets.json'))
def target = targetMatrix.targets.find { it.id == 'neoforge-1.21.1' }
def sourceCommit = providers.exec {
    commandLine 'git', 'rev-parse', 'HEAD'
}.standardOutput.asText.map { it.trim() }
if (target == null || target.branch != 'main' || target.loader != 'neoforge') {
    throw new GradleException('The canonical NeoForge 1.21.1 target is missing from gradle/targets.json.')
}
def dependencyStack = providers.gradleProperty('dependencyStack').getOrElse('current')
if (!(dependencyStack in ['minimum', 'current'])) {
    throw new GradleException("dependencyStack must be minimum or current, got ${dependencyStack}.")
}
def expectedStack = target[dependencyStack]
def actualStack = [
        neoforge: neo_version,
        waystones: waystones_version,
        balm: balm_version,
]
if (actualStack != expectedStack) {
    throw new GradleException(
            "NeoForge 1.21.1 ${dependencyStack} inputs ${actualStack} do not match ${expectedStack}.")
}

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

neoForge {
    version = neo_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    runs {
        configureEach {
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            logLevel = org.slf4j.event.Level.INFO
        }

        client {
            client()
            gameDirectory.set(layout.buildDirectory.dir('runs/client'))
        }

        server {
            server()
            programArgument '--nogui'
            gameDirectory.set(layout.buildDirectory.dir('runs/server'))
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet project(':core').sourceSets.main
        }
    }
}

configurations {
    commonJava {
        canBeResolved = true
        canBeConsumed = false
    }
    commonResources {
        canBeResolved = true
        canBeConsumed = false
    }
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation project(':core')
    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')

    compileOnly "net.blay09.mods:balm-neoforge:${balm_version}"
    localRuntime "net.blay09.mods:balm-neoforge:${balm_version}"

    compileOnly "net.blay09.mods:waystones-neoforge:${waystones_version}"
    localRuntime "net.blay09.mods:waystones-neoforge:${waystones_version}"
}

tasks.named('compileJava', JavaCompile).configure {
    dependsOn configurations.commonJava
    source configurations.commonJava
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn configurations.commonResources
    from configurations.commonResources
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_authors            : mod_authors,
            mod_credits            : mod_credits,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_description        : mod_description,
            waystones_version_range: waystones_version_range,
            balm_version_range     : balm_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar).configure {
    inputs.property('waystonesPlayerSourceCommit', sourceCommit)
    manifest {
        attributes(
                'Implementation-Title': mod_name,
                'Implementation-Version': targetMatrix.modVersion,
                'WaystonesPTPT-Target': target.id,
                'WaystonesPTPT-Build-Stack': dependencyStack,
                'WaystonesPTPT-Source-Commit': sourceCommit.get(),
        )
    }
    from project(':core').sourceSets.main.output
    from(rootProject.file('LICENSE')) {
        into 'META-INF'
        rename { "LICENSE_${mod_id}" }
    }
    from(rootProject.file('TEMPLATE_LICENSE.txt')) {
        into 'META-INF'
        rename { "TEMPLATE_LICENSE_${mod_id}.txt" }
    }
    from(rootProject.file('THIRD_PARTY_NOTICES.md')) {
        into 'META-INF'
        rename { "THIRD_PARTY_NOTICES_${mod_id}.md" }
    }
}

def releaseJar = tasks.named('jar', Jar)
def verifyReleaseJarContents = tasks.register('verifyReleaseJarContents') {
    group = 'verification'
    description = 'Checks that the installable NeoForge JAR contains required metadata, notices, and icon resources.'
    dependsOn releaseJar
    inputs.file(releaseJar.flatMap { it.archiveFile })

    doLast {
        File archive = releaseJar.get().archiveFile.get().asFile
        if (target == null || archive.name != target.artifactFile) {
            throw new GradleException("Release JAR name ${archive.name} does not match the canonical target matrix.")
        }
        def requiredEntries = [
                'META-INF/MANIFEST.MF',
                'META-INF/neoforge.mods.toml',
                'META-INF/LICENSE_waystonesptpt',
                'META-INF/TEMPLATE_LICENSE_waystonesptpt.txt',
                'META-INF/THIRD_PARTY_NOTICES_waystonesptpt.md',
                'waystonesptpt.png',
                'waystonesptpt.mixins.json',
                'waystonesptpt.network.json',
                'com/palosj/waystonesptpt/PlayerTeleportExperienceMode.class',
                'com/palosj/waystonesptpt/client/PlayerPanelLayout.class',
                'com/palosj/waystonesptpt/teleport/TeleportArrivalVerifier.class',
                'com/palosj/waystonesptpt/mixin/WarpStoneItemMixin.class',
                'com/palosj/waystonesptpt/mixin/WaystoneSelectionMenuMixin.class',
                'com/palosj/waystonesptpt/mixin/client/AbstractContainerScreenAccessor.class',
                'com/palosj/waystonesptpt/neoforge/NeoForgeWaystonesPTPT.class',
        ]

        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            def entries = java.util.Collections.list(zip.entries())
            def entryNames = entries.collect { it.name }
            def duplicateEntries = entryNames.countBy { it }.findAll { name, count -> count > 1 }.keySet()
            if (!duplicateEntries.isEmpty()) {
                throw new GradleException(
                        "Release JAR contains duplicate entries: ${duplicateEntries.take(10).join(', ')}")
            }
            def nestedArchives = entries.findAll { entry ->
                !entry.directory && entry.name.toLowerCase(java.util.Locale.ROOT).endsWith('.jar')
            }
            if (!nestedArchives.isEmpty()) {
                throw new GradleException(
                        "Release JAR contains nested dependency archives: ${nestedArchives*.name.take(10).join(', ')}")
            }
            def entryNameSet = entryNames as Set
            def missingEntries = requiredEntries.findAll { !entryNameSet.contains(it) }
            if (!missingEntries.isEmpty()) {
                throw new GradleException("Release JAR is missing required entries: ${missingEntries.join(', ')}")
            }

            def manifest = new java.util.jar.Manifest(zip.getInputStream(zip.getEntry('META-INF/MANIFEST.MF')))
            def attributes = manifest.mainAttributes
            if (attributes.getValue('Implementation-Version') != targetMatrix.modVersion
                    || attributes.getValue('WaystonesPTPT-Target') != target.id
                    || attributes.getValue('WaystonesPTPT-Build-Stack') != dependencyStack
                    || attributes.getValue('WaystonesPTPT-Source-Commit') != sourceCommit.get()) {
                throw new GradleException(
                        'Release JAR manifest does not identify its target, build stack, and source commit.')
            }

            def iconEntry = zip.getEntry('waystonesptpt.png')
            if (iconEntry.size <= 0) {
                throw new GradleException('Release JAR icon is empty.')
            }
            def icon = javax.imageio.ImageIO.read(zip.getInputStream(iconEntry))
            if (icon == null || icon.width != 1024 || icon.height != 1024 || !icon.colorModel.hasAlpha()) {
                throw new GradleException('Release JAR icon must be a readable 1024x1024 PNG with an alpha channel.')
            }
            byte[] iconBytes = zip.getInputStream(iconEntry).bytes
            String iconSha256 = java.security.MessageDigest.getInstance('SHA-256')
                    .digest(iconBytes)
                    .encodeHex()
                    .toString()
            if (iconSha256 != targetMatrix.iconSha256) {
                throw new GradleException('Release JAR does not contain the approved existing project icon.')
            }

            def forbiddenPackagePrefixes = [
                    'com/mojang/',
                    'net/blay09/',
                    'net/fabricmc/',
                    'net/minecraft/',
                    'net/neoforged/',
                    'org/spongepowered/',
            ]
            def bundledDependencies = entries.findAll { entry ->
                forbiddenPackagePrefixes.any { prefix -> entry.name.startsWith(prefix) }
            }
            if (!bundledDependencies.isEmpty()) {
                throw new GradleException("Release JAR bundles loader, game, or dependency classes: ${bundledDependencies*.name.take(10).join(', ')}")
            }

            String metadata = zip.getInputStream(zip.getEntry('META-INF/neoforge.mods.toml')).getText('UTF-8')
            if (metadata.contains('${')) {
                throw new GradleException('Release JAR metadata contains unexpanded template placeholders.')
            }
            if (!metadata.contains('config="waystonesptpt.mixins.json"')) {
                throw new GradleException('Release JAR metadata does not register the mixin configuration.')
            }
            if (!metadata.contains("version=\"${mod_version}\"")) {
                throw new GradleException("Release JAR metadata does not contain version ${mod_version}.")
            }
            [
                    minecraft_version_range,
                    neo_version_range,
                    waystones_version_range,
                    balm_version_range,
            ].each { requiredRange ->
                if (!metadata.contains("versionRange=\"${requiredRange}\"")) {
                    throw new GradleException("Release JAR metadata is missing dependency range ${requiredRange}.")
                }
            }
            if (!metadata.contains('logoFile="waystonesptpt.png"')
                    || !metadata.contains('side="BOTH"')) {
                throw new GradleException('Release JAR metadata has an invalid icon or physical-side declaration.')
            }

            String mixinConfig = zip.getInputStream(zip.getEntry('waystonesptpt.mixins.json')).getText('UTF-8')
            def parsedMixinConfig = new groovy.json.JsonSlurper().parseText(mixinConfig)
            def requiredCommonMixins = ['WarpStoneItemMixin', 'WaystoneSelectionMenuMixin'] as Set
            if ((parsedMixinConfig.mixins as Set) != requiredCommonMixins
                    || parsedMixinConfig.client != ['client.AbstractContainerScreenAccessor']) {
                throw new GradleException('Release JAR mixin configuration does not contain the required server-safe and client-only mixins.')
            }

            String networkContract = zip.getInputStream(zip.getEntry('waystonesptpt.network.json')).getText('UTF-8')
            def parsedNetworkContract = new groovy.json.JsonSlurper().parseText(networkContract)
            if (parsedNetworkContract.networkVersion != '1'
                    || parsedNetworkContract.payloads*.id != ['waystonesptpt:request_player_teleport']
                    || parsedNetworkContract.payloads*.direction != ['client_to_server']) {
                throw new GradleException('Release JAR network contract does not match protocol version 1.')
            }
        }
    }
}

tasks.named('check').configure {
    dependsOn verifyReleaseJarContents
}
