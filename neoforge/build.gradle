plugins {
    id 'net.neoforged.moddev'
}

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

neoForge {
    version = neo_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    runs {
        configureEach {
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            logLevel = org.slf4j.event.Level.INFO
        }

        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

configurations {
    commonJava {
        canBeResolved = true
        canBeConsumed = false
    }
    commonResources {
        canBeResolved = true
        canBeConsumed = false
    }
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')

    compileOnly "net.blay09.mods:balm-neoforge:${balm_version}"
    localRuntime "net.blay09.mods:balm-neoforge:${balm_version}"

    compileOnly "net.blay09.mods:waystones-neoforge:${waystones_version}"
    localRuntime "net.blay09.mods:waystones-neoforge:${waystones_version}"
}

tasks.named('compileJava', JavaCompile).configure {
    dependsOn configurations.commonJava
    source configurations.commonJava
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn configurations.commonResources
    from configurations.commonResources
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_authors            : mod_authors,
            mod_credits            : mod_credits,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_description        : mod_description,
            waystones_version_range: waystones_version_range,
            balm_version_range     : balm_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar).configure {
    from(rootProject.file('LICENSE')) {
        into 'META-INF'
        rename { "LICENSE_${mod_id}" }
    }
    from(rootProject.file('TEMPLATE_LICENSE.txt')) {
        into 'META-INF'
        rename { "TEMPLATE_LICENSE_${mod_id}.txt" }
    }
    from(rootProject.file('THIRD_PARTY_NOTICES.md')) {
        into 'META-INF'
        rename { "THIRD_PARTY_NOTICES_${mod_id}.md" }
    }
}

def releaseJar = tasks.named('jar', Jar)
def verifyReleaseJarContents = tasks.register('verifyReleaseJarContents') {
    group = 'verification'
    description = 'Checks that the installable NeoForge JAR contains required metadata, notices, and icon resources.'
    dependsOn releaseJar
    inputs.file(releaseJar.flatMap { it.archiveFile })

    doLast {
        File archive = releaseJar.get().archiveFile.get().asFile
        def requiredEntries = [
                'META-INF/neoforge.mods.toml',
                'META-INF/LICENSE_waystonesplayer',
                'META-INF/TEMPLATE_LICENSE_waystonesplayer.txt',
                'META-INF/THIRD_PARTY_NOTICES_waystonesplayer.md',
                'waystonesplayer.png',
                'waystonesplayer.mixins.json',
                'com/palosj/waystonesplayer/mixin/client/AbstractContainerScreenAccessor.class',
                'com/palosj/waystonesplayer/neoforge/NeoForgeWaystonesPlayer.class',
        ]

        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            def entries = java.util.Collections.list(zip.entries())
            def entryNames = entries.collect { it.name } as Set
            def missingEntries = requiredEntries.findAll { !entryNames.contains(it) }
            if (!missingEntries.isEmpty()) {
                throw new GradleException("Release JAR is missing required entries: ${missingEntries.join(', ')}")
            }

            if (zip.getEntry('waystonesplayer.png').size <= 0) {
                throw new GradleException('Release JAR icon is empty.')
            }
            if (entries.any { it.name.startsWith('net/blay09/') }) {
                throw new GradleException('Release JAR must not bundle Waystones or Balm classes.')
            }
            if (entries.any { it.name.startsWith('org/spongepowered/') }) {
                throw new GradleException('Release JAR must not bundle the loader-provided Mixin runtime.')
            }

            String metadata = zip.getInputStream(zip.getEntry('META-INF/neoforge.mods.toml')).getText('UTF-8')
            if (metadata.contains('${')) {
                throw new GradleException('Release JAR metadata contains unexpanded template placeholders.')
            }
            if (!metadata.contains('config="waystonesplayer.mixins.json"')) {
                throw new GradleException('Release JAR metadata does not register the client mixin configuration.')
            }
            if (!metadata.contains("version=\"${mod_version}\"")) {
                throw new GradleException("Release JAR metadata does not contain version ${mod_version}.")
            }

            String mixinConfig = zip.getInputStream(zip.getEntry('waystonesplayer.mixins.json')).getText('UTF-8')
            def parsedMixinConfig = new groovy.json.JsonSlurper().parseText(mixinConfig)
            if (!parsedMixinConfig.client?.contains('client.AbstractContainerScreenAccessor')
                    || parsedMixinConfig.mixins) {
                throw new GradleException('Release JAR mixin configuration must contain only the client layout accessor.')
            }
        }
    }
}

tasks.named('check').configure {
    dependsOn verifyReleaseJarContents
}
