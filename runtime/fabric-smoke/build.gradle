plugins {
    id 'net.fabricmc.fabric-loom'
}

def matrix = new groovy.json.JsonSlurper().parse(rootProject.file('gradle/targets.json'))
def targetId = providers.gradleProperty('runtimeTarget').getOrElse('fabric-26.1')
def stackName = providers.gradleProperty('runtimeStack').getOrElse('minimum')
if (!(stackName in ['minimum', 'key', 'current'])) {
    throw new GradleException("runtimeStack must be minimum, key, or current, got ${stackName}.")
}

def target = matrix.targets.find { it.id == targetId }
if (target == null || target.loader != 'fabric' || target.branch != 'fabric/26.x') {
    throw new GradleException("runtimeTarget must name a Fabric 26.x target, got ${targetId}.")
}

def runtimeMinecraft = providers.gradleProperty('runtimeMinecraft')
        .getOrElse(target.minecraft.size() == 1 ? target.minecraft.first() : target.compile.minecraft)
if (!target.minecraft.contains(runtimeMinecraft)) {
    throw new GradleException("${targetId} does not support runtime Minecraft ${runtimeMinecraft}.")
}

def baseStack = target[stackName]
def stack = baseStack == null ? new LinkedHashMap() : new LinkedHashMap(baseStack as Map)
if (target.runtimeStacks) {
    def runtimeEntry = target.runtimeStacks.find { it.minecraft == runtimeMinecraft }
    if (runtimeEntry == null) {
        throw new GradleException("${targetId} has no runtime stack for Minecraft ${runtimeMinecraft}.")
    }
    if (runtimeEntry[stackName]) {
        stack.putAll(runtimeEntry[stackName] as Map)
    }
}
if (stack.isEmpty()) {
    throw new GradleException(
            "${targetId} has no ${stackName} runtime stack for Minecraft ${runtimeMinecraft}.")
}

def defaultBinaryPath = "targets/${target.id}/build/libs/${target.artifactFile}"
def binaryPath = providers.gradleProperty('binaryUnderTest').getOrElse(defaultBinaryPath)
def binaryFile = rootProject.file(binaryPath)
def expectedBinarySha256 = providers.gradleProperty('expectedBinarySha256').orNull
def expectedSourceCommit = providers.gradleProperty('expectedSourceCommit').orNull
def runKey = "${target.id}/${runtimeMinecraft}/${stackName}"
def serverRunDirectory = layout.buildDirectory.dir("runs/${runKey}/server")

loom {
    runs {
        client {
            client()
            name = "${runKey} Client"
            runDir = layout.buildDirectory.dir("runs/${runKey}/client").get().asFile.absolutePath
        }
        server {
            server()
            name = "${runKey} Server"
            runDir = serverRunDirectory.get().asFile.absolutePath
            programArgs '--nogui'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${runtimeMinecraft}"

    implementation("net.fabricmc:fabric-loader:${stack.fabricLoader}") {
        version { strictly(stack.fabricLoader as String) }
    }
    implementation("net.fabricmc.fabric-api:fabric-api:${stack.fabricApi}") {
        version { strictly(stack.fabricApi as String) }
    }
    implementation("net.blay09.mods:balm-fabric:${stack.balm}") {
        version { strictly(stack.balm as String) }
        exclude group: 'net.blay09.mods', module: 'kuma-api-fabric'
        exclude group: 'curse.maven'
        exclude group: 'mysticdrew'
        exclude group: 'mezz.jei'
    }
    implementation("net.blay09.mods:shogi-fabric:${stack.shogi}") {
        version { strictly(stack.shogi as String) }
        exclude group: 'net.blay09.mods', module: 'shogi-common'
        exclude group: 'net.blay09.mods', module: 'shogi-api'
        exclude group: 'curse.maven'
        exclude group: 'mysticdrew'
    }
    implementation("net.blay09.mods:waystones-fabric:${stack.waystones}") {
        version { strictly(stack.waystones as String) }
        exclude group: 'net.blay09.mods', module: 'balm-fabric'
        exclude group: 'net.blay09.mods', module: 'kuma-api-fabric'
        exclude group: 'net.blay09.mods', module: 'shogi-fabric'
        exclude group: 'net.blay09.mods', module: 'shogi-common'
        exclude group: 'net.blay09.mods', module: 'shogi-api'
        exclude group: 'curse.maven'
        exclude group: 'mysticdrew'
        exclude group: 'mezz.jei'
        if (stack.waystonesCapability) {
            capabilities {
                requireCapability "net.blay09.mods:${stack.waystonesCapability}:${stack.waystones}"
            }
        }
    }
    if (binaryFile.isFile()) {
        implementation files(binaryFile)
    }
}

def verifyBinaryUnderTest = tasks.register('verifyBinaryUnderTest') {
    group = 'verification'
    description = 'Requires a minimum-built target JAR before binary runtime smoke tests.'
    inputs.file(binaryFile)

    doLast {
        if (!binaryFile.isFile()) {
            throw new GradleException("Missing binary under test: ${binaryFile}")
        }
        if (binaryFile.name != target.artifactFile) {
            throw new GradleException(
                    "Binary under test ${binaryFile.name} does not match ${target.artifactFile}.")
        }
        new java.util.jar.JarFile(binaryFile).withCloseable { jar ->
            def attributes = jar.manifest?.mainAttributes
            if (attributes?.getValue('Implementation-Version') != matrix.modVersion
                    || attributes?.getValue('WaystonesPlayer-Target') != target.id
                    || attributes?.getValue('WaystonesPlayer-Build-Stack') != 'minimum') {
                throw new GradleException(
                        'Runtime smoke tests must use the unchanged minimum-built release JAR.')
            }
            if (expectedSourceCommit != null
                    && attributes?.getValue('WaystonesPlayer-Source-Commit') != expectedSourceCommit) {
                throw new GradleException('Binary under test does not match the expected source commit.')
            }
            def staleEntries = [
                    'com/palosj/waystonesplayer/teleport/TeleportArrivalVerifier$BlockTarget.class',
            ].findAll { jar.getJarEntry(it) != null }
            if (!staleEntries.isEmpty()) {
                throw new GradleException(
                        "Binary under test contains removed API entries: ${staleEntries.join(', ')}")
            }
        }
        if (expectedBinarySha256 != null) {
            String actualSha256 = java.security.MessageDigest.getInstance('SHA-256')
                    .digest(binaryFile.bytes)
                    .encodeHex()
                    .toString()
            if (actualSha256 != expectedBinarySha256) {
                throw new GradleException('Binary under test does not match the expected SHA-256.')
            }
        }
    }
}

def prepareSmokeServerFiles = tasks.register('prepareSmokeServerFiles') {
    group = 'verification'
    description = 'Creates deterministic first-run server files for an isolated smoke directory.'
    outputs.files(
            serverRunDirectory.map { it.file('eula.txt') },
            serverRunDirectory.map { it.file('server.properties') },
    )

    doLast {
        def runDirectory = serverRunDirectory.get().asFile
        runDirectory.mkdirs()
        new File(runDirectory, 'eula.txt').setText('eula=true\n', 'UTF-8')
        new File(runDirectory, 'server.properties').setText(
                'enable-query=false\n'
                        + 'enable-rcon=false\n'
                        + 'level-name=world\n'
                        + 'online-mode=false\n'
                        + 'server-ip=127.0.0.1\n'
                        + 'server-port=0\n',
                'UTF-8')
    }
}

tasks.matching { it.name in ['runClient', 'runServer'] }.configureEach {
    dependsOn verifyBinaryUnderTest
}

tasks.named('runServer').configure {
    dependsOn prepareSmokeServerFiles
}
