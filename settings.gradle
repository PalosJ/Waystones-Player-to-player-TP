pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven {
            name = 'Fabric'
            url = uri('https://maven.fabricmc.net/')
        }
        maven {
            name = 'TencentCloudFallback'
            url = uri('https://mirrors.cloud.tencent.com/nexus/repository/maven-public/')
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'waystonesptpt'

include('core')

def fabricTargets = [
        'fabric-26.1',
        'fabric-26.1.1',
        'fabric-26.1.2',
        'fabric-26.2',
]
def requestedTasks = gradle.startParameter.taskNames
def normalizedTasks = requestedTasks.collect { taskName ->
    taskName.startsWith(':') ? taskName : ":${taskName}"
}
def aggregateTasks = ['build', 'check', 'assemble', 'test', 'clean', 'projects', 'tasks'] as Set
def includeCompleteModel = requestedTasks.isEmpty() || requestedTasks.any { taskName ->
    !taskName.startsWith(':') && aggregateTasks.contains(taskName)
}
def selectedTargets = includeCompleteModel
        ? fabricTargets
        : fabricTargets.findAll { targetId ->
            normalizedTasks.any { taskName -> taskName.startsWith(":targets:${targetId}:") }
        }

selectedTargets.each { targetId ->
    include("targets:${targetId}")
    project(":targets:${targetId}").buildFileName = '../../gradle/fabric-target.gradle'
}

if (includeCompleteModel || normalizedTasks.any { it.startsWith(':runtime:fabric-smoke:') }) {
    include('runtime:fabric-smoke')
}
