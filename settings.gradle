pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven {
            name = 'NeoForge'
            url = uri('https://maven.neoforged.net/releases')
        }
        maven {
            name = 'TencentCloudFallback'
            url = uri('https://mirrors.cloud.tencent.com/nexus/repository/maven-public/')
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'waystonesplayer'

include('core')
include('runtime:neoforge-smoke')

def neoForgeTargets = [
        'neoforge-1.21.2-1.21.3',
        'neoforge-1.21.4',
        'neoforge-1.21.5',
        'neoforge-1.21.6',
        'neoforge-1.21.7',
        'neoforge-1.21.8',
        'neoforge-1.21.9',
        'neoforge-1.21.10',
        'neoforge-1.21.11',
]
neoForgeTargets.each { targetId ->
    include("targets:${targetId}")
    project(":targets:${targetId}").buildFileName = '../../gradle/neoforge-target.gradle'
}
