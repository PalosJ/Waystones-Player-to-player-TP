pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven {
            name = 'NeoForge'
            url = uri('https://maven.neoforged.net/releases')
        }
        maven {
            name = 'TencentCloudFallback'
            url = uri('https://mirrors.cloud.tencent.com/nexus/repository/maven-public/')
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'waystonesptpt'

include('core')
include('common')
include('neoforge')

def normalizedTasks = gradle.startParameter.taskNames.collect { taskName ->
    taskName.startsWith(':') ? taskName : ":${taskName}"
}
if (normalizedTasks.any { it.startsWith(':runtime:neoforge-smoke:') }) {
    include('runtime:neoforge-smoke')
}
